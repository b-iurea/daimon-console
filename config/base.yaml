# Hermes config for the Daimon box — rendered by scripts/install.sh into
# $HERMES_HOME/config.yaml (never overwritten silently).
# The brain is the local llama-server (loopback, OpenAI-compatible); no cloud.
# Keys follow the upstream schema (model.provider: "custom" + model.base_url).

model:
  default: "daimon-local"          # replaced at setup time with the real id from the brain's /v1/models
  provider: custom
  base_url: "http://127.0.0.1:8080/v1"   # llama-server on loopback — the `port` key of daimon's llm module (default 8080)
  # api key stays in .env (DASH-style var) — never in this file.

# Sovereign box: no metrics, no consent dialog. `offer_version` must equal upstream's
# shared_metrics_consent.OFFER_VERSION (2) or Hermes re-asks on every first-ish start.
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2

display:
  interface: tui                    # the Ink TUI is the Daimon console surface
  skin: daimon                      # from skins/daimon.yaml in this overlay

# Safety posture on the box (PLAN invariants — controller judges everything):
approvals:
  mode: manual                      # mutating actions require the owner

# The socket adapter (plugins/daimon-bridge): /daimon relays to the Daimon agent
# on agent.sock (env DAIMON_SOCK), and the console's own tool calls are blocked —
# the Daimon agent acts, its controller judges. Fails closed when the socket is down.
plugins:
  enabled:
    - daimon-bridge
  entries:
    daimon-bridge:
      settings:
        guard: block                # never "off" on the box
        allow_tools: []
        turn_wait: 300
