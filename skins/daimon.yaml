# Daimon skin — slate dark + green accent (matches the framebuffer UI).
# Owned by the daimon-console overlay; NOT part of upstream Hermes source.
# Rules: colors must be #rrggbb; missing keys inherit the built-in `default`.
# Palette = daimon-os daimon/src/tui.rs (the framebuffer UI), and nothing else:
#   BG #0f172a  SURFACE #1e293b  BORDER #334155  TEXT #e2e8f0  STRONG #f8fafc  MUTED #94a3b8
#   FAINT #64748b  ACCENT #22c55e  SKY #38bdf8  VIOLET #a78bfa  AMBER #f59e0b  RED #ef4444
# Same roles as there: green = Daimon/ok, sky = the owner's input, amber = tools/warnings,
# red = errors. tests/decision_card.test.mjs fails on any other hex.
# Design rationale, 16-colour fallback and component patterns: docs/design.md.

name: daimon
description: Daimon — slate dark with sovereign green

colors:
  background: "#0f172a"        # slate-900 (fb UI base)
  ui_accent: "#22c55e"         # green-500 (fb UI accent)
  banner_accent: "#22c55e"
  banner_title: "#f8fafc"      # STRONG: titles one step above body text
  banner_text: "#e2e8f0"
  ui_text: "#e2e8f0"
  ui_primary: "#f8fafc"        # STRONG
  ui_label: "#94a3b8"          # MUTED
  banner_dim: "#94a3b8"        # MUTED
  banner_border: "#334155"
  ui_border: "#334155"
  ui_tool: "#f59e0b"           # AMBER: tool calls are amber in tui.rs
  ui_thinking: "#64748b"       # FAINT
  ui_ok: "#22c55e"
  ui_warn: "#f59e0b"
  ui_error: "#ef4444"
  prompt: "#38bdf8"            # SKY: the owner's input line in tui.rs
  input_rule: "#334155"
  response_border: "#22c55e"
  status_bar_bg: "#1e293b"     # slate-800
  status_bar_text: "#94a3b8"   # MUTED
  status_bar_good: "#22c55e"
  status_bar_warn: "#f59e0b"
  status_bar_critical: "#ef4444"
  session_label: "#22c55e"
  session_border: "#334155"
  diff_added: "#22c55e"
  diff_removed: "#ef4444"
  syntax_string: "#38bdf8"     # SKY
  syntax_number: "#f59e0b"
  syntax_keyword: "#a78bfa"    # VIOLET: green stays reserved for Daimon/ok (not code)
  syntax_comment: "#64748b"

branding:
  agent_name: "Daimon"
  welcome: "Daimon is awake — everything stays on this machine. Type /help for commands."
  goodbye: "Daimon sleeps. Nothing left the box."
  response_label: " ◆ Daimon "
  prompt_symbol: "❯"
  help_header: "(◆) Commands"

spinner:
  wings: [["⟪◆", "◆⟫"]]

tool_prefix: "┊"

banner_logo: |-
  [bold #0f172a on #22c55e] ✦ Daimon [/]

banner_hero: |-
  [#64748b]· sovereign · local · yours ·[/]
  [#a78bfa]◆[/] [#94a3b8]every action is judged[/]
  [#38bdf8]◆[/] [#94a3b8]you have the last word[/]
  [#22c55e]◆[/] [#94a3b8]nothing leaves the box[/]

# Desktop-GUI customCSS: proposed in docs/design.md §5.5, not shipped here — upstream loads the key
# `customCSS` but scripts/sync-upstream.sh's skin check only knows `custom_css` (follow-up §7.6).
